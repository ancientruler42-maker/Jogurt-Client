<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Jogurt Client Setup</title>
<style>
:root{
  --bg:#0a0c0b;
  --bg2:#121612;
  --card:#161c18;
  --line:#243028;
  --g:#5fd068;
  --g2:#34a853;
  --text:#eef3ef;
  --mute:#8b9a8e;
  --btntext:#0a120c;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-user-select:none;user-select:none}
html,body{height:100%;overflow:hidden;font-family:"Segoe UI",system-ui,-apple-system,sans-serif;color:var(--text);background:transparent}
body{
  background:
    radial-gradient(ellipse 80% 55% at 50% 28%, rgba(52,168,83,.18), transparent 60%),
    radial-gradient(ellipse 60% 40% at 50% 100%, rgba(20,40,28,.5), transparent 50%),
    #0a0c0b;
}

/* frameless titlebar hit area */
.titlebar{
  height:40px;display:flex;align-items:center;justify-content:flex-end;gap:4px;
  padding:0 10px;-webkit-app-region:drag;
}
.titlebar button{
  -webkit-app-region:no-drag;width:36px;height:28px;border:0;border-radius:8px;
  background:transparent;color:var(--mute);cursor:pointer;font-size:13px;line-height:1;
  transition:background .15s,color .15s;
}
.titlebar button:hover{background:rgba(255,255,255,.06);color:var(--text)}
.titlebar button.close:hover{background:#c42b2b;color:#fff}

.stage{
  height:calc(100% - 40px);display:flex;flex-direction:column;
  align-items:center;justify-content:center;padding:8px 48px 40px;text-align:center;
}

/* logo with soft ring glow */
.logo-wrap{
  position:relative;width:112px;height:112px;margin-bottom:22px;
  animation:rise .55s cubic-bezier(.2,1.1,.4,1) both;
}
.logo-wrap .ring{
  position:absolute;inset:-10px;border-radius:50%;
  background:conic-gradient(from 210deg, #3d9b55, #7dff9a, #2e6b3c, #5fd068, #3d9b55);
  opacity:.85;filter:blur(.3px);
  animation:spin 10s linear infinite;
}
.logo-wrap .ring::after{
  content:"";position:absolute;inset:4px;border-radius:50%;background:#0a0c0b;
}
.logo-wrap img{
  position:relative;z-index:1;width:112px;height:112px;border-radius:50%;
  object-fit:cover;display:block;
  box-shadow:0 0 40px rgba(95,208,104,.25), 0 12px 40px rgba(0,0,0,.45);
}
.logo-wrap .glow{
  position:absolute;inset:-28px;border-radius:50%;
  background:radial-gradient(circle, rgba(95,208,104,.35), transparent 68%);
  z-index:0;pointer-events:none;
}

.brand{
  animation:rise .55s .05s cubic-bezier(.2,1.1,.4,1) both;
  margin-bottom:6px;
}
.brand h1{
  font-size:28px;font-weight:600;letter-spacing:-.2px;
  color:#dfe8e1;
}
.brand h1 span{color:#9aab9e;font-weight:500}
.badge{
  display:inline-block;margin-top:6px;font-size:12px;color:var(--mute);
  letter-spacing:.2px;
}
.badge.ok{color:var(--g)}

.copy{
  margin-top:28px;max-width:360px;
  animation:rise .55s .1s cubic-bezier(.2,1.1,.4,1) both;
}
.copy h2{
  font-size:20px;font-weight:600;margin-bottom:8px;color:#f2f6f3;
}
.copy p{
  font-size:13.5px;line-height:1.5;color:var(--mute);
}

.actions{
  margin-top:28px;display:flex;flex-direction:column;align-items:center;gap:10px;
  width:100%;max-width:320px;
  animation:rise .55s .14s cubic-bezier(.2,1.1,.4,1) both;
}
.btn,.ghost{
  position:relative;overflow:hidden;cursor:pointer;font:inherit;border:0;
  transition:transform .15s cubic-bezier(.3,1.4,.5,1),filter .15s,background .15s,opacity .15s,box-shadow .2s;
}
.btn{
  width:100%;border-radius:999px;padding:14px 24px;font-size:14.5px;font-weight:600;
  background:linear-gradient(180deg,#f4f7f5,#e2eae4);color:#121612;
  box-shadow:0 1px 0 rgba(255,255,255,.5) inset, 0 8px 24px rgba(0,0,0,.25);
}
.btn:hover{filter:brightness(1.05);transform:translateY(-1px)}
.btn:active:not(:disabled){transform:scale(.97);filter:brightness(.96)}
.btn:disabled{opacity:.45;cursor:default;transform:none;box-shadow:none}
.btn.primary-green{
  background:linear-gradient(180deg,var(--g),var(--g2));color:var(--btntext);
  box-shadow:0 1px 0 rgba(255,255,255,.2) inset, 0 8px 28px rgba(52,168,83,.28);
}
.ghost{
  border-radius:999px;padding:10px 22px;font-size:13px;font-weight:500;
  background:rgba(255,255,255,.04);color:var(--mute);border:1px solid rgba(255,255,255,.06);
  min-width:100px;
}
.ghost:hover{color:var(--text);background:rgba(255,255,255,.07)}
.ghost:active{transform:scale(.97)}

.progress{
  display:none;width:100%;max-width:320px;margin-top:8px;flex-direction:column;gap:10px;
  animation:rise .4s cubic-bezier(.2,1.1,.4,1) both;
}
.progress.on{display:flex}
.bar{
  height:6px;border-radius:6px;background:rgba(255,255,255,.06);overflow:hidden;
}
.bar i{
  display:block;height:100%;width:0%;border-radius:6px;
  background:linear-gradient(90deg,var(--g2),var(--g));
  transition:width .25s ease;
}
.ptext{font-size:12.5px;color:var(--mute)}

.foot{
  position:absolute;left:16px;bottom:12px;font-size:11px;color:#5a6a5e;
}

.err{color:#ff8e8e;font-size:13px;margin-top:10px;min-height:18px}

/* path picker (install only) */
.path-row{
  display:none;width:100%;max-width:360px;margin-top:18px;text-align:left;
  animation:rise .5s .08s cubic-bezier(.2,1.1,.4,1) both;
}
.path-row.on{display:block}
.path-row .label{font-size:11px;color:var(--mute);margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px}
.path-row .box{
  display:flex;gap:8px;align-items:center;
  background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.07);
  border-radius:12px;padding:8px 8px 8px 12px;
}
.path-row .box span{flex:1;font-size:12px;color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.path-row .box button{
  border:0;border-radius:8px;padding:7px 12px;font-size:12px;cursor:pointer;
  background:rgba(255,255,255,.06);color:var(--text);
}
.path-row .box button:hover{background:rgba(255,255,255,.1)}

@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
  <div class="titlebar">
    <button id="min" title="Minimize">─</button>
    <button id="close" class="close" title="Close">✕</button>
  </div>

  <div class="stage">
    <div class="logo-wrap">
      <div class="glow"></div>
      <div class="ring"></div>
      <img src="icon.png" alt="Jogurt">
    </div>

    <div class="brand">
      <h1>Jogurt <span>Client</span></h1>
      <div class="badge" id="badge">Checking…</div>
    </div>

    <div class="copy">
      <h2 id="headline">Setting up</h2>
      <p id="sub">Preparing Jogurt Client…</p>
    </div>

    <div class="path-row" id="path-row">
      <div class="label">Install location</div>
      <div class="box">
        <span id="path-val">—</span>
        <button type="button" id="browse">Change</button>
      </div>
    </div>

    <div class="progress" id="prog">
      <div class="bar"><i id="bar"></i></div>
      <div class="ptext" id="ptext">Installing…</div>
    </div>

    <div class="err" id="err"></div>

    <div class="actions" id="actions">
      <button class="btn" id="primary">Install Jogurt Client</button>
      <button class="ghost" id="secondary">Close</button>
    </div>
  </div>

  <div class="foot" id="ver">Version —</div>

<script>
const $ = s => document.querySelector(s);
$('#min').onclick = () => installer.minimize();
$('#close').onclick = () => installer.close();
$('#secondary').onclick = () => installer.close();

let state = { installed: false, installPath: '', currentVersion: null, targetVersion: '', busy: false, done: false };

function setDoneUI(updated) {
  state.done = true;
  $('#badge').textContent = 'Installed';
  $('#badge').className = 'badge ok';
  $('#headline').textContent = "You're all set";
  $('#sub').textContent = updated
    ? 'Jogurt Client was updated. You’ll find it in your Start menu.'
    : 'Jogurt Client is installed. You’ll find it in your Start menu.';
  $('#path-row').classList.remove('on');
  $('#prog').classList.remove('on');
  $('#primary').textContent = 'Open Jogurt Client';
  $('#primary').className = 'btn';
  $('#primary').disabled = false;
  $('#secondary').textContent = 'Close';
  $('#secondary').style.display = '';
}

function setInstallUI(info) {
  state.done = false;
  $('#ver').textContent = 'Version ' + (info.targetVersion || '');
  $('#path-val').textContent = info.installPath || '—';
  if (info.installed) {
    $('#badge').textContent = 'Installed';
    $('#badge').className = 'badge ok';
    const needsUpdate = info.currentVersion && info.currentVersion !== info.targetVersion;
    $('#headline').textContent = needsUpdate ? 'Update available' : 'Already installed';
    $('#sub').textContent = needsUpdate
      ? `Version ${info.currentVersion} → ${info.targetVersion}. Profiles and settings are kept.`
      : 'Repair or reinstall without losing your AppData profiles.';
    $('#primary').textContent = needsUpdate ? 'Update Jogurt Client' : 'Repair Jogurt Client';
    $('#primary').className = 'btn primary-green';
    $('#path-row').classList.add('on');
  } else {
    $('#badge').textContent = 'Not installed';
    $('#badge').className = 'badge';
    $('#headline').textContent = 'Install Jogurt Client';
    $('#sub').textContent = 'FPS-focused Minecraft launcher. One click to install.';
    $('#primary').textContent = 'Install Jogurt Client';
    $('#primary').className = 'btn primary-green';
    $('#path-row').classList.add('on');
  }
}

async function refresh() {
  const info = await installer.getInstallInfo();
  state = { ...state, ...info };
  setInstallUI(info);
}

$('#browse').onclick = async () => {
  if (state.busy || state.done) return;
  const p = await installer.pickFolder(state.installPath);
  if (p) { state.installPath = p; $('#path-val').textContent = p; }
};

$('#primary').onclick = async () => {
  if (state.done) {
    await installer.launchApp();
    return;
  }
  if (state.busy) return;
  state.busy = true;
  $('#primary').disabled = true;
  $('#browse').disabled = true;
  $('#path-row').classList.remove('on');
  $('#prog').classList.add('on');
  $('#err').textContent = '';
  $('#headline').textContent = state.installed ? 'Updating…' : 'Installing…';
  $('#sub').textContent = 'This only takes a moment.';
  $('#badge').textContent = 'Working';
  $('#badge').className = 'badge';
  try {
    const r = await installer.install({ path: state.installPath });
    if (!r.ok) throw new Error(r.error || 'Install failed');
    $('#bar').style.width = '100%';
    setDoneUI(!!r.updated);
  } catch (e) {
    $('#err').textContent = String(e.message || e);
    $('#primary').disabled = false;
    $('#browse').disabled = false;
    $('#path-row').classList.add('on');
    $('#prog').classList.remove('on');
    await refresh();
  } finally {
    state.busy = false;
  }
};

installer.onProgress(p => {
  $('#bar').style.width = (p.pct || 0) + '%';
  $('#ptext').textContent = p.text || '';
});

refresh();
</script>
</body>
</html>
